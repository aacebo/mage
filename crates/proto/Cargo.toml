[package]
name = "proto"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
awc = { version = "3.8" }
actix-codec = { version = "0.5" }

serde_json = { version = "1" }
serde_valid = { version = "2" }
serde = { version = "1", features = ["default", "derive"] }

uuid = { version = "1.19", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

error = { path = "../error" }
types = { path = "../types" }
