name: mage

services:
  postgres:
    container_name: mage-postgres
    image: pgvector/pgvector:pg17
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: pg_isready -U admin -d main
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: mage-rabbitmq
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  mage-broker:
    container_name: mage-broker
    build:
      context: .
      dockerfile: crates/mage-broker/Dockerfile
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mage-worker:
    container_name: mage-worker
    build:
      context: .
      dockerfile: crates/mage-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/main
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      ROUTING_CANDIDATE_LIMIT: 5
      ROUTING_MIN_CONFIDENCE: 0.20
      ROUTING_AMBIGUITY_MARGIN: 0.05
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
